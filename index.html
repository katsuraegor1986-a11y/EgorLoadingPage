<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090807">
  <meta name="robots" content="noindex, nofollow">
  <title>Егор Кацура — загружаем сайт</title>
  <link rel="preload" as="image" href="./loading-screen.jpg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="screen">
    <img class="artwork" src="./loading-screen.jpg" alt="">
    <div class="overlay"></div>

    <section class="message" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="status">Подготавливаем сайт…</p>
      <p class="hint">Обычно это занимает совсем немного времени</p>
      <a class="button" id="open-site"
         href="https://egorkatsura.onrender.com/">
        Открыть сайт
      </a>
      <p class="small">Если загрузка затянулась, нажмите кнопку выше.</p>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
